name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LINK_MODE: copy

jobs:
  native:
    name: Native CPU / ${{ matrix.os }} / Python 3.14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran pkg-config zip unzip
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install gcc@14 pkgconf
          echo "FC=$(brew --prefix gcc@14)/bin/gfortran-14" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/vcpkg-installed
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*', 'cmake/ports/**', 'scripts/build_native.py') }}
      - name: Install the development package
        run: uv sync --locked
      - name: Test Windows wheel repair
        if: runner.os == 'Windows'
        run: uv run --no-sync python -m pytest tests/packaging/test_windows_wheel_repair.py --csp-profile all
      - name: Test the editable installation
        run: |
          uv run --no-sync python tests/packaging/wheel_smoke.py --backend cpu --import-order numpy-first
          uv run --no-sync python tests/packaging/wheel_smoke.py --backend cpu --import-order native-first
      - name: Build, repair, and test installed wheel
        run: uv run --no-sync python scripts/build_native.py --backend cpu --test --output-dir dist/native-cpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-cpu-${{ runner.os }}
          path: |
            dist/native-cpu
            build/*/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.1
          python-version: "3.12"
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync python -m pytest tests/packaging/test_release_validation.py tests/packaging/test_build_platforms.py --csp-profile all

  wheels:
    uses: ./.github/workflows/wheels.yml

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync python -m build --sdist --outdir dist/sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdist
          path: dist/sdist/*.tar.gz
          if-no-files-found: error
