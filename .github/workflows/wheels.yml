name: Build wheel artifacts

on:
  workflow_call:
    inputs:
      backend:
        type: string
        default: cuda

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  build:
    name: Wheels / ${{ matrix.os }} / ${{ matrix.backend }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: ${{ inputs.backend }}
          - os: ubuntu-24.04-arm
            backend: cpu
          - os: windows-2022
            backend: ${{ inputs.backend }}
          - os: macos-14
            backend: cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-install-project --group ci
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install gcc@14 pkgconf
          echo "FC=$(brew --prefix gcc@14)/bin/gfortran-14" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: runner.os != 'Linux'
        with:
          path: build/vcpkg-installed
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*', 'cmake/ports/**', 'scripts/build_native.py') }}
      - name: Build repaired CPython 3.11–3.14 wheels
        env:
          WHEEL_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: uv run --no-sync python scripts/build_wheels.py --backend "$WHEEL_BACKEND" --output-dir "dist/wheels-$WHEEL_BACKEND"
      # Hosted runners cannot execute CUDA kernels. The separate hardware
      # workflow and build_native.py --test qualify CUDA runtime behavior.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ runner.os }}-${{ runner.arch }}-${{ matrix.backend }}
          path: dist/wheels-${{ matrix.backend }}/*.whl
          if-no-files-found: error
