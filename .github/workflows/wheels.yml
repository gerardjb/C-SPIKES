name: Build wheel artifacts

on:
  workflow_call:
    inputs:
      backend:
        type: string
        required: true
      ref:
        type: string
        default: ""
      version:
        type: string
        default: ""

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  build:
    name: Wheels / ${{ matrix.os }} / ${{ inputs.backend }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-install-project --group ci
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: runner.os == 'Windows'
        with:
          path: build/vcpkg-installed
          key: native-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*', 'cmake/ports/**', 'scripts/build_native.py') }}
      - name: Build repaired CPython 3.11–3.14 wheels
        env:
          WHEEL_BACKEND: ${{ inputs.backend }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          args=(--backend "$WHEEL_BACKEND" --output-dir "dist/wheels-$WHEEL_BACKEND")
          if [[ -n "$RELEASE_VERSION" ]]; then args+=(--version "$RELEASE_VERSION"); fi
          uv run --no-sync python scripts/build_wheels.py "${args[@]}"
      # Hosted runners cannot execute CUDA kernels. The separate hardware
      # workflow and build_native.py --test qualify CUDA runtime behavior.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels-${{ runner.os }}-${{ inputs.backend }}
          path: dist/wheels-${{ inputs.backend }}/*.whl
          if-no-files-found: error
