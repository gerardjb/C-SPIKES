# 
[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
    "numpy>=2,<3; python_version >= '3.9'",
    "numpy==1.24.4; python_version < '3.9'",
]
build-backend = "scikit_build_core.build"

[project]
name = "c_spikes"
#version = "0.1.0"
license.file = "LICENSE"
requires-python = ">=3.11"
description = "End-to-end fluorescence to spike inference procedure"
authors = [
    { name = "Gerard Joey Broussard", email = "gerardjb@princeton.edu" },
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "ruamel.yaml",
    "tqdm == 4.64.0"    # Also ENS2-specific. Works, but may want to relax pin at some point
]

# invoked via, e.g., "pip install -e .[test]"
[project.optional-dependencies]
 gui = ["PySide6"]
 ens2 = ["torch>=2"]
 cascade = ["tensorflow"]
 all = ["c_spikes[gui,ens2,cascade]"]
 test = [
   "pytest >=7",
   "pytest-cov >=3",
 ]
 docs = [
   "sphinx>=7.0",
   "myst_parser>=0.13",
   "sphinx_copybutton",
   "sphinx_autodoc_typehints",
   "furo>=2023.08.17",
 ]
  jupyter = [
   "notebook",
   "jupyterlab",
   "ipykernel",
   "nbconvert",
   "nbformat",
 ]

 [tool.scikit-build]
 minimum-version = "0.10"
 cmake.build-type = "Release"
 install.components = ["CSPPython"]
 sdist.exclude = ["sample_data/**", "notebooks/**"]
 metadata.version.provider = "scikit_build_core.metadata.setuptools_scm" # gets versions dynamically from git tags
 sdist.include = [
  "src/c_spikes/_version.py", # persistent storage of version without git history (as below)
  "src/c_spikes/oasis/PROVENANCE.md",
  "src/c_spikes/oasis/oasis_methods.cpp",
  "src/c_spikes/oasis/oasis_methods.pyx",
 ]
 
 # Ensure proper version capture regardless of git file access
 [tool.setuptools_scm]
 write_to = "src/c_spikes/_version.py"
 
 # Prep across platforms/hardware/OS with unit tests
 [tool.cibuildwheel]
 build = ["cp{311,312}-manylinux_x86_64", "cp{311,312}-win_amd64"]
 build-frontend = "build[uv]"
 before-all = "python {project}/scripts/prepare_wheel_build.py"
 test-command = [
   "python {project}/tests/packaging/wheel_smoke.py --backend cpu --import-order numpy-first",
   "python {project}/tests/packaging/wheel_smoke.py --backend cpu --import-order native-first",
   "python -m pytest {project}/tests --csp-profile=native_core",
   "python -m pytest {project}/tests --csp-profile=python_contracts",
 ]
 test-extras = ["test"]

 [tool.cibuildwheel.linux]
 manylinux-x86_64-image = "manylinux_2_28"
 before-all = "/opt/python/cp312-cp312/bin/python {project}/scripts/prepare_wheel_build.py"

 [tool.cibuildwheel.windows]
 repair-wheel-command = 'delvewheel repair --add-path "{project}/build/vcpkg-installed/x64-windows-csp/bin" -w {dest_dir} {wheel}'

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
build = [
  "build>=1.2",
  "scikit-build-core>=0.10",
  "setuptools-scm>=8",
  "pybind11>=3.0.2",
  "cmake>=3.24,<4",
  "ninja>=1.11",
  "auditwheel>=6; sys_platform == 'linux'",
  "patchelf; sys_platform == 'linux'",
  "delvewheel>=1.9; sys_platform == 'win32'",
]
dev = [{include-group = "test"}, {include-group = "build"}]
ci = ["cibuildwheel==4.3.0"]
