[pytest]
minversion = 7.0
addopts = -ra --showlocals --strict-markers --strict-config -m "not slow"
xfail_strict = true
filterwarnings = error
markers =
    slow: explicitly allocated integration/inference qualification
    requires_torch: optional PyTorch tests
    requires_tensorflow: optional TensorFlow tests
testpaths = tests
log_cli_level = INFO
